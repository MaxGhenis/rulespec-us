format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/42/415/b
    source_sha256: 5b41d1cdacd39f4c49da7cf41dbbf22e1ea29b125be7105ca2daa12292e06eae
  summary: “Computation base years” are calendar years after 1950 and before the applicable
    old-age-entitlement or death boundary, excluding any calendar year entirely included
    in a period of disability.
  deferred_outputs:
  - output: us:statutes/42/415/b#legacy_average_monthly_wage
    reason: Paragraph (4) incorporates the December 1978 version of subsection (b),
      including unavailable historical paragraph (2)(C) mechanics.
  - output: us:statutes/42/415/b#child_care_increased_disability_dropout_years
    reason: The child-care increase requires the section 403(f)(5) earnings definition,
      for which no admitted executable RuleSpec source is available.
  - output: us:statutes/42/415/b#indexing_year_for_average_indexed_monthly_earnings
    reason: Full indexing-year selection requires earliest-event and preceding-disability-entitlement
      history not represented by an admitted upstream source.
  - output: us:statutes/42/415/b#computation_base_year_treated_as_last_year_under_subsection_f
    reason: Section 415(b)(3)(B)(ii) depends on subsection (f)(2)(C), which is not
      supplied as an executable dependency.
  - output: us:statutes/42/415/b#elapsed_years_special_rule_under_social_security_amendments_of_1972
    reason: The retained exception in section 104(j)(2) of the Social Security Amendments
      of 1972 has no admitted executable dependency.
rules:
- name: computation_base_year_is_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  visibility: private
  source: 42 U.S.C. § 415(b)(2)(B)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: calendar years after 1950 and before
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the first month of that entitlement
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the year succeeding the year of his death
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: excludes any calendar year entirely included in a period of disability
  versions:
  - effective_from: '1979-01-01'
    formula: "computation_base_year > elapsed_years_baseline_year\nand (\n  (\n  \
      \  individual_is_entitled_to_old_age_insurance_benefit\n    and computation_base_year\
      \ < year_of_first_old_age_entitlement\n  )\n  or (\n    not individual_is_entitled_to_old_age_insurance_benefit\n\
      \    and computation_base_year <= year_of_death_or_later_sentinel\n  )\n)\n\
      and not computation_base_year_is_entirely_in_period_of_disability"
- name: months_per_benefit_computation_year
  kind: parameter
  dtype: Integer
  unit: months
  visibility: public
  source: 42 U.S.C. § 415(b)(1)(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: unit
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the number of months in those years
  versions:
  - effective_from: '1979-01-01'
    formula: calendar_years_to_months(1)
- name: aime_rounding_multiple
  kind: parameter
  dtype: Money
  unit: USD
  visibility: public
  source: 90 FR 49047, AIME computation explanation
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/guidance/ssa/cola/2026/federal-register/block-1
          excerpt: round the resulting average amount down to the next lower dollar
            amount
  versions:
  - effective_from: '1979-01-01'
    formula: '1'
- name: disability_dropout_rule_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  visibility: private
  source: 42 U.S.C. § 415(b)(2)(A)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: Clause (ii), once applicable with respect to any individual, shall
            continue to apply
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: unless prior to the month in which such eligibility begins there
            occurs a period of at least 12 consecutive months
  versions:
  - effective_from: '1979-01-01'
    formula: "individual_is_entitled_to_disability_insurance_benefit\nor (\n  individual_previously_entitled_to_disability_insurance_benefit\n\
      \  and not at_least_twelve_consecutive_months_without_disability_or_old_age_benefit_before_current_eligibility\n\
      )"
- name: elapsed_years_for_old_age_benefit_computation
  kind: derived
  entity: Person
  dtype: Integer
  period: Year
  visibility: public
  source: 42 U.S.C. § 415(b)(2)(B)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: calendar years after 1950 (or, if later, the year in which the
            individual attained age 21) and before the year in which the individual
            died
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: if it occurred earlier (but after 1960), the year in which he attained
            age 62
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: excludes any calendar year any part of which is included in a period
            of disability
  versions:
  - effective_from: '1979-01-01'
    formula: "max(\n  0,\n  min(year_of_death_or_later_sentinel, year_individual_attained_age_62)\n\
      \  - max(elapsed_years_baseline_year, year_individual_attained_age_21)\n  -\
      \ 1\n  - count_over_periods(elapsed_year_is_partly_in_period_of_disability)\n\
      )"
- name: disability_dropout_years
  kind: derived
  entity: Person
  dtype: Integer
  period: Year
  visibility: private
  source: 42 U.S.C. § 415(b)(2)(A)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: one-fifth of such individual’s elapsed years (disregarding any
            resulting fractional part of a year), but not by more than 5 years
  versions:
  - effective_from: '1979-01-01'
    formula: 'if disability_dropout_rule_applies: min( disability_dropout_year_limit,
      floor(elapsed_years_for_old_age_benefit_computation / disability_dropout_fraction_denominator)
      ) else: 0'
- name: old_age_benefit_computation_year_count
  kind: derived
  entity: Person
  dtype: Integer
  period: Year
  visibility: public
  source: 42 U.S.C. § 415(b)(2)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: entitled to old-age insurance benefits (except as provided in the
            second sentence of this subparagraph), or who has died, by 5 years
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: Clause (ii), once applicable with respect to any individual, shall
            continue to apply
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: shall in no case be less than 2
  versions:
  - effective_from: '1979-01-01'
    formula: "max(\n  minimum_benefit_computation_years,\n  elapsed_years_for_old_age_benefit_computation\n\
      \  - (if disability_dropout_rule_applies:\n       disability_dropout_years\n\
      \     else:\n       old_age_benefit_computation_year_dropout_years)\n)"
- name: indexed_creditable_earnings_for_computation_base_year
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  visibility: public
  source: 42 U.S.C. § 415(b)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the wages and self-employment income paid in or credited to such
            year
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the national average wage index
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: occurs after the second calendar year specified in subparagraph
            (A)(ii)(I)
  versions:
  - effective_from: '1979-01-01'
    formula: "if computation_base_year_is_eligible:\n  if computation_base_year >\
      \ indexing_year_for_aime:\n    creditable_earnings_for_computation_base_year\n\
      \  else:\n    creditable_earnings_for_computation_base_year\n    * national_average_wage_index_for_indexing_year\n\
      \    / national_average_wage_index_for_computation_base_year\nelse:\n  0"
- name: old_age_benefit_computation_year_earnings_total
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  visibility: public
  source: 42 U.S.C. § 415(b)(1)(A), (b)(2)(B)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: those computation base years, equal in number to the number determined
            under subparagraph (A), for which the total of such individual’s wages
            and self-employment income, after adjustment under paragraph (3), is the
            largest
  versions:
  - effective_from: '1979-01-01'
    formula: "sum_top_n_over_periods(\n  indexed_creditable_earnings_for_computation_base_year,\n\
      \  old_age_benefit_computation_year_count\n)"
- name: average_indexed_monthly_earnings
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  visibility: public
  source: 42 U.S.C. § 415(b)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: equal to the quotient obtained by dividing
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the total (after adjustment under paragraph (3)) of his wages paid
            in and self-employment income credited to his benefit computation years
      - path: versions[0].formula
        kind: unit
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: the number of months in those years
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/ssa/cola/2026/federal-register/block-1
          excerpt: round the resulting average amount down to the next lower dollar
            amount
  versions:
  - effective_from: '1979-01-01'
    formula: "floor(\n  (\n    old_age_benefit_computation_year_earnings_total\n \
      \   / calendar_years_to_months(old_age_benefit_computation_year_count)\n  )\n\
      \  / aime_rounding_multiple\n)\n* aime_rounding_multiple"
- name: old_age_benefit_computation_year_dropout_years
  kind: parameter
  dtype: Integer
  unit: years
  visibility: public
  source: 42 U.S.C. § 415(b)(2)(A)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: by 5 years
  versions:
  - effective_from: '1979-01-01'
    formula: '5'
- name: minimum_benefit_computation_years
  kind: parameter
  dtype: Integer
  unit: years
  visibility: public
  source: 42 U.S.C. § 415(b)(2)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: shall in no case be less than 2
  versions:
  - effective_from: '1979-01-01'
    formula: '2'
- name: elapsed_years_baseline_year
  kind: parameter
  dtype: Integer
  unit: years
  visibility: public
  source: 42 U.S.C. § 415(b)(2)(B)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: calendar years after 1950
  versions:
  - effective_from: '1979-01-01'
    formula: '1950'
- name: disability_dropout_fraction_denominator
  kind: parameter
  dtype: Integer
  unit: years
  visibility: private
  source: 42 U.S.C. § 415(b)(2)(A)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: one-fifth of such individual’s elapsed years
  versions:
  - effective_from: '1979-01-01'
    formula: '5'
- name: disability_dropout_year_limit
  kind: parameter
  dtype: Integer
  unit: years
  visibility: private
  source: 42 U.S.C. § 415(b)(2)(A)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/415/b
          excerpt: not by more than 5 years
  versions:
  - effective_from: '1979-01-01'
    formula: '5'
