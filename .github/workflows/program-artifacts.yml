name: program-artifacts

# Compiles every <jurisdiction>/programs/ spec through axiom-compose +
# axiom-rules-engine.
# On pull requests this is a gate: every canonical program spec must parse,
# compose, and compile; any failure makes the check red, so spec/corpus drift
# is caught at PR time instead of at admission time.
# Pushes to main rebuild the artifacts as a validation gate only. Publishing
# or activating a release is a separate, explicitly approved operation.

on:
  pull_request:
    paths:
      - "us*/programs/**"
      - "tools/**"
      - "us/**"
      - "us-*/**"
      - ".github/workflows/program-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "us*/programs/**"
      - "tools/**"
      - "us/**"
      - "us-*/**"
      - ".github/workflows/program-artifacts.yml"

env:
  # Toolchain pins — bump deliberately; they define artifact provenance.
  AXIOM_COMPOSE_REF: fabe0b3b3fd6e90d3e8f075516f9b668f524f711
  AXIOM_RULES_ENGINE_REF: e19f1b7573c74512f20a6b71a0c55dbbf333d41b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install axiom-compose
        run: |
          python -m pip install --quiet pyyaml \
            "axiom-compose @ git+https://github.com/TheAxiomFoundation/axiom-compose@${AXIOM_COMPOSE_REF}"

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ env.AXIOM_RULES_ENGINE_REF }}
          path: .engine-src

      - name: Cache engine build
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: .engine-src/target/release/axiom-rules-engine
          key: engine-bin-${{ runner.os }}-${{ env.AXIOM_RULES_ENGINE_REF }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: cargo build --release --bin axiom-rules-engine
        working-directory: .engine-src

      - name: Compile all program specs
        run: |
          AXIOM_RULES_ENGINE_BIN="$PWD/.engine-src/target/release/axiom-rules-engine" \
            python tools/build_program_artifacts.py \
              --root "$GITHUB_WORKSPACE" \
              --dist dist
